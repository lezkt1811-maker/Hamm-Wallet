<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing Calculator — Admin</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="site-header"></div>
<div class="page">
  <h1 class="mt16">🧮 Pricing Calculator</h1>
  <a href="dashboard.html" class="btn ghost small">← Dashboard</a>

  <div class="win mt16">
    <div class="win-titlebar"><span>Enter Your Costs</span></div>
    <div class="win-body">
      <div class="field-row">
        <div><label for="pcMaterial">Material cost ($)</label><input id="pcMaterial" type="number" step="0.01" min="0" value="0.30"></div>
        <div><label for="pcInk">Ink cost ($)</label><input id="pcInk" type="number" step="0.01" min="0" value="0.10"></div>
      </div>
      <div class="field-row">
        <div><label for="pcPackaging">Packaging cost ($)</label><input id="pcPackaging" type="number" step="0.01" min="0" value="0.15"></div>
        <div><label for="pcShipping">Shipping cost ($)</label><input id="pcShipping" type="number" step="0.01" min="0" value="0.60"></div>
      </div>
      <div class="field-row">
        <div><label for="pcFeePct">Platform / payment fees (%)</label><input id="pcFeePct" type="number" step="0.1" min="0" value="3.4"></div>
        <div><label for="pcLaborMin">Labor time (minutes)</label><input id="pcLaborMin" type="number" step="1" min="0" value="3"></div>
      </div>
      <div class="field-row">
        <div><label for="pcLaborRate">Labor rate ($/hour)</label><input id="pcLaborRate" type="number" step="1" min="0" value="15"></div>
        <div>
          <label for="pcMargin">Target profit margin (%)</label>
          <input id="pcMargin" type="range" min="0" max="90" value="55">
          <div class="center" id="pcMarginLabel">55%</div>
        </div>
      </div>
    </div>
  </div>

  <div class="win">
    <div class="win-titlebar"><span>💡 Recommendation</span></div>
    <div class="win-body" id="pcResult"></div>
  </div>
</div>
<div id="site-footer"></div>

<script src="../js/store.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/admin-pricing-calculator.js"></script>
</body>
</html>

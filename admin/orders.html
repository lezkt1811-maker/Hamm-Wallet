<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders — Admin</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="site-header"></div>
<div class="page">
  <h1 class="mt16">🧾 Orders</h1>
  <a href="dashboard.html" class="btn ghost small">← Dashboard</a>

  <div class="win mt16">
    <div class="win-body flex wrap" style="gap:8px">
      <select id="statusFilter" style="flex:1;min-width:140px">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="paid">Paid</option>
        <option value="printing">Printing</option>
        <option value="packed">Packed</option>
        <option value="shipped">Shipped</option>
        <option value="completed">Completed</option>
      </select>
    </div>
  </div>

  <h2 class="mt24">Custom Order Requests</h2>
  <div id="customRequestList"></div>

  <h2 class="mt24">Shop Orders</h2>
  <div id="orderList"></div>
</div>
<div id="site-footer"></div>

<script src="../js/store.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/admin-orders.js"></script>
</body>
</html>

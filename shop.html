<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — StarSticker Y2K</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<div class="page">
  <h1 class="mt16">🛍️ Shop Stickers</h1>

  <div class="win">
    <div class="win-body flex wrap" style="gap:10px">
      <input id="searchInput" placeholder="Search stickers or tags..." style="flex:2;min-width:160px">
      <select id="collectionFilter" style="flex:1;min-width:140px">
        <option value="">All Collections</option>
      </select>
      <select id="sortSelect" style="flex:1;min-width:140px">
        <option value="new">Newest</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="bestseller">Best Sellers</option>
      </select>
    </div>
  </div>

  <div id="bundlePromo"></div>

  <div id="shopGrid" class="grid mt16"></div>

  <!-- Fallback for search engine crawlers / JS disabled -->
  <noscript>
    <h2>Featured Stickers</h2>
    <div class="grid">
      <a href="product.html?id=star-burst-001" style="text-decoration:none;color:inherit">
        <div style="border:2px solid var(--chrome-1);border-radius:8px;padding:12px;text-align:center">
          <div style="font-weight:700">Y2K Star Burst</div>
          <div style="font-size:14px;color:#888">$3.50 — 3in die-cut</div>
          <div style="font-size:12px;margin-top:8px">Chrome pixel-star with rainbow gradient outline</div>
        </div>
      </a>
      <a href="product.html?id=flip-phone-002" style="text-decoration:none;color:inherit">
        <div style="border:2px solid var(--chrome-1);border-radius:8px;padding:12px;text-align:center">
          <div style="font-weight:700">Retro Flip Phone</div>
          <div style="font-size:14px;color:#888">$4.00 — 3in holographic</div>
          <div style="font-size:12px;margin-top:8px">Glossy holographic flip-phone sticker</div>
        </div>
      </a>
      <a href="product.html?id=cyber-heart-003" style="text-decoration:none;color:inherit">
        <div style="border:2px solid var(--chrome-1);border-radius:8px;padding:12px;text-align:center">
          <div style="font-weight:700">Rainbow Cyber Heart</div>
          <div style="font-size:14px;color:#888">$3.00 — 2in glitter</div>
          <div style="font-size:12px;margin-top:8px">Glitter-finish heart with chrome outline</div>
        </div>
      </a>
    </div>
  </noscript>
</div>
<div id="site-footer"></div>

<script src="js/store.js"></script>
<script src="js/nav.js"></script>
<script src="js/seed.js"></script>
<script src="js/shop.js"></script>
</body>
</html>

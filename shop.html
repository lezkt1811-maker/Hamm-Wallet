<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — StarSticker Y2K</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<div class="page">
  <h1 class="mt16">🛍️ Shop Stickers</h1>

  <div class="win">
    <div class="win-body flex wrap" style="gap:10px">
      <input id="searchInput" placeholder="Search stickers or tags..." style="flex:2;min-width:160px">
      <select id="collectionFilter" style="flex:1;min-width:140px">
        <option value="">All Collections</option>
      </select>
      <select id="sortSelect" style="flex:1;min-width:140px">
        <option value="new">Newest</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="bestseller">Best Sellers</option>
      </select>
    </div>
  </div>

  <div id="bundlePromo"></div>

  <div id="shopGrid" class="grid mt16"></div>
</div>
<div id="site-footer"></div>

<script src="js/store.js"></script>
<script src="js/nav.js"></script>
<script src="js/seed.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
